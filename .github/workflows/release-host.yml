name: Release host

# On a tag v*: build the host, test it, package it with
# scripts/release-host.mjs and attach the tarball, its .sha256,
# host-version.json and the npm tarballs of rn-a11y-host and
# react-native-a11y-tree (npm pack; not published) to the GitHub release. The CLI downloads it
# with RN_A11Y_HOST_BASE_URL=https://github.com/<owner>/<repo>/releases/download/<tag>
# and the host-version.json of that release (commit it to the repo root, or
# point RN_A11Y_HOST_MANIFEST at it).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Same image and toolchain as ci.yml.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Bun: package manager and script runner for this repo.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            brew install --cask android-commandlinetools
            echo "ANDROID_HOME=$(brew --prefix)/share/android-commandlinetools" >> "$GITHUB_ENV"
          fi

      - name: Android SDK CMake 3.30.5
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "cmake;3.30.5"

      - name: Homebrew packages
        run: brew install cmake ninja

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # A clean build: no host cache for releases.
      - name: Build host
        run: bun run build:host

      # x86_64 slice, cross-built on this arm64 runner (CMAKE_OSX_ARCHITECTURES);
      # release-host.mjs then packs a universal binary (both native/dist/<arch>).
      - name: Build host (x86_64 slice)
        run: RN_A11Y_HOST_ARCH=x86_64 bun run build:host

      - uses: actions/upload-artifact@v7
        with:
          name: rn-a11y-host-x86_64
          path: native/dist/x86_64/rn-a11y-host

      - name: Tests
        run: |
          bun run typecheck
          bun run test
          bun run test:e2e

      - name: Package host
        run: node scripts/release-host.mjs --out release

      # npm packages (not published yet): rn-a11y-host with osx-bin/ filled
      # by --pack, and the CLI with its tsc build in dist/.
      - name: npm pack
        run: |
          node scripts/release-host.mjs --pack
          bun run build
          npm pack --pack-destination release
          (cd packages/rn-a11y-host && npm pack --pack-destination ../../release)
          ls -la release

      - name: Test the packaged host (download from file://)
        run: |
          RN_A11Y_HOST_BASE_URL="file://$PWD/release" \
          RN_A11Y_HOST_MANIFEST="$PWD/release/host-version.json" \
          RN_A11Y_HOST_CACHE_DIR="$RUNNER_TEMP/host-cache" \
          RN_A11Y_HOST_BIN='' \
          RN_A11Y_HOST_SKIP_PACKAGE=1 \
            bun run rn-a11y-tree render examples/basic/App.tsx --platform android --format text --no-quiet 2> stderr.txt
          cat stderr.txt
          # Fails if the CLI fell back to native/dist.
          grep -q 'downloading host' stderr.txt
          if grep -q 'download failed' stderr.txt; then exit 1; fi

      - name: Upload to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Prebuilt rn-a11y-host (see host-version.json)."
          gh release upload "$tag" release/* --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: rn-a11y-host-release
          path: release/

  # The x86_64 slice cannot run on the arm64 runner (no Rosetta): render with
  # it on an Intel runner.
  intel-check:
    needs: release
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: rn-a11y-host-x86_64
          path: x86_64-host

      - name: Render with the x86_64 host
        run: |
          chmod +x x86_64-host/rn-a11y-host
          uname -m
          lipo -info x86_64-host/rn-a11y-host
          RN_A11Y_HOST_BIN="$PWD/x86_64-host/rn-a11y-host" \
            bun run rn-a11y-tree render examples/basic/App.tsx --preset android-phone --format text | tee render.txt
          grep -q 'submit View #submit role=button "Submit"' render.txt

  # Later: publish both packages to npm from the release tarballs. Needs the
  # NPM_TOKEN secret (the user publishes 0.1.0 manually from these tarballs).
