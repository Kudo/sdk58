name: Release host

# The hosts of every platform, packaged and verified:
# - host-macos: the universal macOS host (arm64 + x86_64 cross-built on the
#   arm64 runner), tested; artifacts rn-a11y-host-osx (universal) and
#   rn-a11y-host-osx-slices (arm64/, x86_64/);
# - host-linux: linux-host.yml (built in manylinux_2_28, tested on
#   ubuntu-24.04, debian:10, ubuntu:20.04); artifact rn-a11y-host-linux64;
# - host-windows: windows-host.yml (built on windows-2025 with MSVC/clang-cl,
#   tested there); artifact rn-a11y-host-win64;
# - package: release tarballs per platform (release-host.ts), the
#   CLI and optional runtime packages (release-host.ts --pack
#   --artifacts), npm pack of all packages, and a scratch-project install
#   that renders with the packaged Linux host; also the file:// download;
# - verify-macos / verify-windows / intel-check: the same install on macOS
#   and Windows, and the x86_64 slice on an Intel runner;
# - publish: on a tag v*, the GitHub release with every asset. The CLI
#   downloads with RN_A11Y_HOST_BASE_URL=https://github.com/<owner>/<repo>/releases/download/<tag>
#   and the host-version.json of that release.
# On push to ci/release-all everything but publish runs.

on:
  push:
    tags: ['v*']
    branches: [ci/release-all]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-macos:
    # Same image and toolchain as ci.yml.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Bun: package manager and script runner for this repo.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            brew install --cask android-commandlinetools
            echo "ANDROID_HOME=$(brew --prefix)/share/android-commandlinetools" >> "$GITHUB_ENV"
          fi

      - name: Android SDK CMake 3.30.5
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "cmake;3.30.5"

      - name: Homebrew packages
        run: brew install cmake ninja

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # A clean build: no host cache for releases. Both slices (the x86_64
      # one cross-built with CMAKE_OSX_ARCHITECTURES) and the lipo'd
      # native/dist/universal/rn-a11y-host.
      - name: Build host (universal)
        run: RN_A11Y_HOST_ARCH=universal bun run build:host

      - name: Tests
        run: |
          bun run typecheck
          bun run test
          bun run test:e2e

      - uses: actions/upload-artifact@v7
        with:
          name: rn-a11y-host-osx
          path: native/dist/universal/rn-a11y-host
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: rn-a11y-host-osx-slices
          path: |
            native/dist/arm64/rn-a11y-host
            native/dist/x86_64/rn-a11y-host
          if-no-files-found: error

  host-linux:
    uses: ./.github/workflows/linux-host.yml

  host-windows:
    uses: ./.github/workflows/windows-host.yml

  package:
    needs: [host-macos, host-linux, host-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      # The submodule: release-host.ts records its commit and React Native version.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # One directory per artifact: artifacts/rn-a11y-host-<slot>/.
      - uses: actions/download-artifact@v7
        with:
          pattern: rn-a11y-host-*
          path: artifacts

      - name: Release tarballs (one per platform and arch)
        run: |
          find artifacts -type f -name 'rn-a11y-host*' ! -name '*.debug' -exec chmod +x {} +
          ls -lR artifacts
          pack() { bun scripts/release-host.ts --out release --platform "$1" --arch "$2" --bin "$3" > /dev/null; }
          pack darwin arm64 artifacts/rn-a11y-host-osx-slices/arm64/rn-a11y-host
          pack darwin x86_64 artifacts/rn-a11y-host-osx-slices/x86_64/rn-a11y-host
          pack linux x86_64 artifacts/rn-a11y-host-linux64/rn-a11y-host
          if [ -f artifacts/rn-a11y-host-win64/rn-a11y-host.exe ]; then
            pack win32 x86_64 artifacts/rn-a11y-host-win64/rn-a11y-host.exe
          fi
          cat release/host-version.json

      # npm packages (not published yet): optional runtime binaries and
      # the CLI with its bun build in dist/.
      - name: npm pack
        run: |
          bun scripts/release-host.ts --pack --artifacts artifacts
          bun run build
          (cd packages/react-native-a11y-tree && npm pack --pack-destination ../../release)
          for pkg in packages/runtime-*; do
            (cd "$pkg" && npm pack --pack-destination ../../release)
          done
          ls -la release
          for archive in release/react-native-a11y-tree-runtime-*.tgz; do tar -tzvf "$archive"; done

      - name: Install the packages in a scratch project and render (Linux host from the package)
        run: bash scripts/verify-packages.sh release

      - name: Test the packaged Linux host (download from file://)
        run: |
          RN_A11Y_HOST_BASE_URL="file://$PWD/release" \
          RN_A11Y_HOST_MANIFEST="$PWD/release/host-version.json" \
          RN_A11Y_HOST_CACHE_DIR="$RUNNER_TEMP/host-cache" \
          RN_A11Y_HOST_BIN='' \
          RN_A11Y_HOST_SKIP_PACKAGE=1 \
            bun run rn-a11y-tree render examples/basic/App.tsx --platform android --format text --no-quiet 2> stderr.txt
          cat stderr.txt
          # Fails if the CLI fell back to native/dist.
          grep -q 'downloading host' stderr.txt
          if grep -q 'download failed' stderr.txt; then exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  verify-macos:
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Install the packages in a scratch project and render (macOS host from the package)
        run: bash scripts/verify-packages.sh release

  verify-windows:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: git config
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Install the packages in a scratch project and render (Windows host from the package)
        run: bash scripts/verify-packages.sh release

  # The x86_64 slice cannot run on the arm64 runner (no Rosetta): render with
  # it on an Intel runner.
  intel-check:
    needs: host-macos
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: rn-a11y-host-osx-slices
          path: slices

      - name: Render with the x86_64 host
        run: |
          chmod +x slices/x86_64/rn-a11y-host
          uname -m
          lipo -info slices/x86_64/rn-a11y-host
          RN_A11Y_HOST_BIN="$PWD/slices/x86_64/rn-a11y-host" \
            bun run rn-a11y-tree render examples/basic/App.tsx --preset android-phone --format text | tee render.txt
          grep -q 'submit View #submit role=button "Submit"' render.txt

  publish:
    needs: [package, verify-macos, verify-windows, intel-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Release body: the CHANGELOG.md section of the tag's version.
          notes="$RUNNER_TEMP/release-notes.md"
          bun scripts/changelog-section.ts "$tag" > "$notes"
          printf '\nAssets: the npm tarballs of react-native-a11y-tree and @react-native-a11y-tree/runtime-* (macOS, Linux x64, Windows x64), and the prebuilt hosts (tar.gz + .sha256 per platform, host-version.json).\n' >> "$notes"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes"
          fi
          gh release upload "$tag" release/* --clobber

  # Later: publish platform packages first, then CLI to npm from the release tarballs. Needs the
  # NPM_TOKEN secret (until then the user publishes manually from these tarballs).
  # npm-publish:
  #   needs: publish
  #   runs-on: ubuntu-latest
  #   if: startsWith(github.ref, 'refs/tags/')
  #   permissions:
  #     contents: read
  #     id-token: write
  #   steps:
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: '24'
  #         registry-url: 'https://registry.npmjs.org'
  #     - uses: actions/download-artifact@v7
  #       with:
  #         name: release
  #         path: release
  #     - name: npm publish
  #       env:
  #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  #       run: |
  #         for pkg in release/react-native-a11y-tree-runtime-*.tgz; do
  #           npm publish --provenance --access public "$pkg"
  #         done
  #         npm publish --provenance --access public release/react-native-a11y-tree-[0-9]*.tgz
