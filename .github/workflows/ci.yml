name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 arm64. Image facts (actions/runner-images macos-15-arm64
    # readme, image 20260907): ANDROID_HOME=/Users/runner/Library/Android/sdk
    # with Command Line Tools 16.0 and SDK CMake 3.31.5 / 4.1.2 (not 3.30.5,
    # which build-host.sh installs), Xcode 16.4 default and 26.0.1-26.3
    # installed, Java 17 available, Node.js 22 default.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The native patches are developed with Xcode 26 (Apple clang 21).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Node runs the CLI and the tests. Node 24 still bundles corepack
      # (Yarn 1 for the React Native submodule).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Bun: package manager and script runner for this repo.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            brew install --cask android-commandlinetools
            echo "ANDROID_HOME=$(brew --prefix)/share/android-commandlinetools" >> "$GITHUB_ENV"
          fi

      - name: Android SDK CMake 3.30.5
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "cmake;3.30.5"

      - name: Homebrew packages
        # No OpenSSL: the host hashes with a CommonCrypto shim (FANTOM_OPENSSL_SHIM).
        run: brew install cmake ninja

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Host cache key
        id: host-key
        run: |
          echo "submodule=$(git -C third_party/react-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          # build:host compiles these npm libraries from node_modules
          # (native/overlay/tester/CMakeLists.txt, RN_NATIVE_LIBS_DIR).
          libs=$(node -e '
            const libs = ["react-native-screens", "react-native-safe-area-context",
              "react-native-gesture-handler", "react-native-reanimated", "react-native-worklets",
              "expo-modules-core", "@expo/ui"];
            console.log(libs.map(l => {
              try { return l + "@" + require(l + "/package.json").version; }
              catch { return l + "@none"; }
            }).join(","));')
          echo "native libs: $libs"
          echo "libs=$(echo "$libs" | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore host binary
        id: host-cache
        uses: actions/cache@v6
        with:
          path: native/dist
          key: host-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-key.outputs.xcode }}-${{ steps.host-key.outputs.submodule }}-${{ steps.host-key.outputs.libs }}-${{ hashFiles('native/overlay/**', 'native/scripts/**', 'scripts/build-host.sh') }}

      - name: Build host
        if: steps.host-cache.outputs.cache-hit != 'true'
        # JAVA_HOME points to JDK 17 (setup-java).
        run: bun run build:host

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: E2E tests (e2e/*.test.ts)
        run: RN_A11Y_E2E_STRICT=1 bun run test:e2e

      # Diagnostics when a step fails: the expo-ui example with host stderr,
      # the macOS crash reports of the host, and the host binary (to run it
      # locally under lldb).
      - name: Re-run the expo-ui example verbosely (on failure)
        if: failure()
        continue-on-error: true
        run: |
          sw_vers
          bun run rn-a11y-tree render examples/expo-ui/App.tsx --platform android --format text -v --no-quiet || true
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          # The same run under lldb: backtraces of all threads at the crash.
          cat > "$RUNNER_TEMP/lldb-host" <<EOF
          #!/bin/bash
          exec lldb --batch -o "process launch" -k "thread backtrace all" -k "quit 1" -- "$PWD/native/dist/arm64/rn-a11y-host" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/lldb-host"
          RN_A11Y_HOST_BIN="$RUNNER_TEMP/lldb-host" bun run rn-a11y-tree render examples/expo-ui/App.tsx --platform android --format text -v --no-quiet || true

      - name: Upload crash reports and the host binary (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-crash-${{ github.run_id }}
          path: |
            ~/Library/Logs/DiagnosticReports/rn-a11y-host*
            ~/Library/Logs/DiagnosticReports/fantom_tester*
            native/dist/arm64/rn-a11y-host
          if-no-files-found: warn

      - name: Fantom itests (native/tests)
        run: |
          set -euo pipefail
          RN=third_party/react-native
          FANTOM=$RN/private/react-native-fantom
          # Same overlay as build-host.sh.
          rsync -a native/overlay/ "$FANTOM/"
          # On a cache hit the submodule has no build tree: use the dist host
          # (it is relocatable; its dylibs are in lib/ next to it). Never
          # replace a binary that build-host.sh just built.
          if [ ! -x "$FANTOM/build/tester/fantom_tester" ]; then
            mkdir -p "$FANTOM/build/tester"
            cp native/dist/"$(uname -m)"/rn-a11y-host "$FANTOM/build/tester/fantom_tester"
            # The static host (default) has no lib/.
            if [ -d native/dist/"$(uname -m)"/lib ]; then
              cp -R native/dist/"$(uname -m)"/lib "$FANTOM/build/tester/lib"
            fi
          fi
          # JS deps of the submodule (skipped by build-host.sh on a cache hit).
          if [ ! -d "$RN/node_modules" ]; then
            (cd "$RN" && corepack yarn@1.22.22 install --frozen-lockfile --non-interactive)
          fi
          # Some itests import npm libraries (screens, navigation, gesture
          # handler). The submodule's Metro only sees its own node_modules,
          # so install the same versions as this repo there (CI checkout
          # only; this changes the submodule's package.json).
          libs=$(node -e '
            const libs = ["react-native-screens", "react-native-safe-area-context",
              "react-native-gesture-handler", "react-native-reanimated", "react-native-worklets",
              "@react-navigation/native", "@react-navigation/native-stack",
              "expo", "expo-modules-core", "@expo/ui"];
            const out = [];
            for (const l of libs) {
              try { out.push(l + "@" + require(l + "/package.json").version); } catch {}
            }
            console.log(out.join(" "));')
          echo "Installing into the submodule: $libs"
          # shellcheck disable=SC2086
          (cd "$RN" && corepack yarn@1.22.22 add -W --ignore-scripts --no-lockfile --non-interactive $libs)
          # Every native/tests/*-itest.js, plus the files they import
          # (e.g. FantomNavigationStackApp.tsx).
          TESTS_DIR=$RN/packages/react-native/Libraries/Components/View/__tests__
          cp native/tests/* "$TESTS_DIR/"
          # FantomExpoUI-itest.js: fantomExpoUIPrelude.js reads the per-view
          # configs from fantomExpoUIViewConfigs.json next to it.
          cp native/tools/expo-view-configs/out/viewConfigs.json "$TESTS_DIR/fantomExpoUIViewConfigs.json"
          names=$(for f in native/tests/*-itest.js; do basename "$f" -itest.js; done)
          echo "Fantom itests: $names"
          # `yarn fantom` shells out to `yarn`; it must be Yarn 1.
          SHIM_DIR=$(mktemp -d)
          printf '#!/usr/bin/env bash\nexec corepack yarn@1.22.22 "$@"\n' > "$SHIM_DIR/yarn"
          chmod +x "$SHIM_DIR/yarn"
          # Fantom treats GITHUB_ACTIONS as Meta CI and tries Buck builds.
          # shellcheck disable=SC2086
          (cd "$RN" && env -u GITHUB_ACTIONS PATH="$SHIM_DIR:$PATH" yarn fantom $names)

  # The host built with AddressSanitizer + UndefinedBehaviorSanitizer
  # (Release, so NDEBUG code paths are the shipped ones) and the e2e suites
  # that exercise native layout, gestures and animation against it. Fails on
  # a non-zero exit and on any sanitizer report in the host stderr.
  sanitize:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SANITIZER_HOST: third_party/react-native/private/react-native-fantom/build/tester-release-sanitize/fantom_tester
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            brew install --cask android-commandlinetools
            echo "ANDROID_HOME=$(brew --prefix)/share/android-commandlinetools" >> "$GITHUB_ENV"
          fi

      - name: Android SDK CMake 3.30.5
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "cmake;3.30.5"

      - name: Homebrew packages
        run: brew install cmake ninja

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Host cache key
        id: host-key
        run: |
          echo "submodule=$(git -C third_party/react-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          libs=$(node -e '
            const libs = ["react-native-screens", "react-native-safe-area-context",
              "react-native-gesture-handler", "react-native-reanimated", "react-native-worklets",
              "expo-modules-core", "@expo/ui"];
            console.log(libs.map(l => {
              try { return l + "@" + require(l + "/package.json").version; }
              catch { return l + "@none"; }
            }).join(","));')
          echo "libs=$(echo "$libs" | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore sanitizer host
        id: host-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SANITIZER_HOST }}
          key: host-sanitize-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-key.outputs.xcode }}-${{ steps.host-key.outputs.submodule }}-${{ steps.host-key.outputs.libs }}-${{ hashFiles('native/overlay/**', 'native/scripts/**', 'scripts/build-host.sh') }}

      - name: Build sanitizer host (ASan + UBSan, Release)
        if: steps.host-cache.outputs.cache-hit != 'true'
        env:
          RN_A11Y_HOST_SANITIZE: '1'
          RN_A11Y_HOST_BUILD_TYPE: Release
        run: bun run build:host

      - name: E2E tests against the sanitizer host
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_stack_use_after_return=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          export RN_A11Y_HOST_BIN="$PWD/$SANITIZER_HOST"
          export RN_A11Y_HOST_STDERR_LOG="$RUNNER_TEMP/host-stderr.log"
          : > "$RN_A11Y_HOST_STDERR_LOG"
          status=0
          RN_A11Y_E2E_STRICT=1 bun run test:e2e \
            e2e/expo-ui.test.ts e2e/navigation-stack.test.ts e2e/gestures.test.ts \
            e2e/reanimated.test.ts e2e/scrolling.test.ts || status=$?
          echo "host stderr log: $(wc -l < "$RN_A11Y_HOST_STDERR_LOG") lines"
          if grep -nE 'ERROR: AddressSanitizer|runtime error:' "$RN_A11Y_HOST_STDERR_LOG"; then
            echo "::error::sanitizer report in the host stderr (see above and the artifact)"
            status=1
          fi
          exit "$status"

      - name: Upload the host stderr log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-host-stderr-${{ github.run_id }}
          path: ${{ runner.temp }}/host-stderr.log
          if-no-files-found: warn
